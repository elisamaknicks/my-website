    border: 'none', cursor: 'pointer', transition: 'background 150ms ease',
    whiteSpace: 'nowrap', ...style

  if (ghost && dark) return (
    <button onClick={onClick}
    onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
    style={{ ...base, background: hov ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.07)',
      color: C.onDark, border: '1px solid rgba(255,255,255,0.18)' }}>
      {children}
    </button>);

    <button onClick={onClick}
    onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
    style={{ ...base, background: hov ? C.card : 'transparent',
      color: C.ink, border: `1px solid ${C.hairline}` }}>
      {children}
    </button>);

  return (
    <button onClick={onClick}
    onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
    style={{ ...base, background: hov ? C.primaryAct : 'var(--accent-color, var(--color-primary))',
      color: C.onPrimary }}>
      {children}
    </button>);
